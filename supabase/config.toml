# LabelM — Supabase CLI configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "labelm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
# Mirror of the hosted Auth -> URL Configuration. Keep the exact app paths so
# both the invite and password-reset links land on their real routes.
additional_redirect_urls = [
  "http://localhost:5173/accept-invite",
  "http://localhost:5173/reset-password",
]

# Invite-only product: public sign-ups stay disabled.
[auth.email]
enable_signup = false
enable_confirmations = true

# ---------------------------------------------------------------------------
# Auth email templates — DEV copies (still "LabelMaster Pro").
# Local `supabase start` uses these files. Production uses the rebranded
# "Maira Cam 3D" copies in supabase/templates/prod/, which must be pasted into
# the hosted dashboard (Auth -> Email Templates); the hosted project does not
# read this file. Paths are relative to the project root.
# ---------------------------------------------------------------------------
[auth.email.template.invite]
subject = "You've been invited to LabelMaster Pro"
content_path = "./supabase/templates/dev/invite.html"

[auth.email.template.magic_link]
subject = "Your LabelMaster Pro sign-in link"
content_path = "./supabase/templates/dev/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your LabelMaster Pro password"
content_path = "./supabase/templates/dev/recovery.html"

# ---------------------------------------------------------------------------
# Custom SMTP — NOT enabled yet. The project still uses Supabase's built-in
# email relay (rate-limited, team members only). When the client has a domain,
# switch to a real provider (e.g. ZeptoMail) by filling in the block below and
# setting the same values in the hosted dashboard (Auth -> SMTP Settings).
# See authPlan.md "SMTP switch checklist" for the full runbook.
# ---------------------------------------------------------------------------
# [auth.email.smtp]
# host = "smtp.yourprovider.com"
# port = 587
# user = "your-smtp-user"
# pass = "your-smtp-password"
# admin_email = "no-reply@mail.yourdomain.com"
# sender_name = "LabelM"

[functions.invite-user]
verify_jwt = true

[functions.revoke-user]
verify_jwt = true